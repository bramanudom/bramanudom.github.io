<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet & Hannah</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="/and-hannah/assets/heart.svg" type="image/svg+xml">
    <link rel="icon" href="/and-hannah/assets/heart.svg" sizes="any">
</head>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
    // Trigger confetti when the window is fully loaded
    window.addEventListener('load', () => {
        // We add a slight delay (500ms) so it fires right as your 'reveal' animations finish
        setTimeout(() => {
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 }, // Fires from slightly below the center
                colors: ['#213f22', '#803030', '#3476ad', '#fdfaf3'],
                disableForReducedMotion: true // Respects guest's accessibility settings
            });
        }, 500);
    });
</script>

<body class="landing-body">
    <main class="landing-container">

        <div class="card save-the-date-card">
            <h1 class="couple-names">
                Pet
                <br>
                &
                <br>
                Hannah
            </h1>
            <p class="wedding-announcement">are having a wedding!</p>

            <div class="multilingual-divider">
                <h2 class="multilingual-th">เพชรและแฮนน่าจะแต่งงานกัน!</h2>
                <h2 class="multilingual-ko">펫과 해나의 결혼식에 초대합니다!</h2>
            </div>

            <div>
                <div class="date-display">Nov 6, 2027</div>
                <div class="location-display">Chiang Mai, Thailand</div>
            </div>
            <div class="multilingual-divider">
                <h2 class="multilingual-th">
                    6 พฤศจิกายน 2027
                    <br>เชียงใหม่ ประเทศไทย
                </h2>
                <h2 class="multilingual-ko">
                    2027년 11월 6일
                    <br>태국 치앙마이
                </h2>
            </div>

            <div class="coming-soon-notes">
                <p style="font-weight: 600;">More details to follow soon</p>
                <p>รายละเอียดเพิ่มเติมเร็วๆ นี้ค่ะ</p>
                <p>자세한 일정은 곧 안내해 드리겠습니다.</p>
            </div>
        </div>

    </main>
</body>

</html>
