<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Pet & Hannah</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="landing-body">
    <main class="container">
        <div class="card" style="max-width: 400px; margin: 100px auto; text-align: center;">
            <h2 style="color: var(--teak);">Welcome!</h2>
            <p>Please enter the guest code from your invitation:</p>

            <div class="input-group" style="display: flex; gap: 10px; justify-content: center; margin: 20px 0;">
                <input type="password" id="passInput" placeholder="Enter Code"
                    style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
                <button onclick="checkPass()" class="btn btn-teak">Enter</button>
            </div>

            <p id="err" style="color: var(--ruby); display: none;">Incorrect code, please try again.</p>

            <a href="index.html" style="font-size: 0.8rem; color: var(--emerald);">← Back to Save the Date</a>
        </div>
    </main>

    <script>
        function checkPass() {
            const pass = document.getElementById('passInput').value.toLowerCase().trim();
            if (pass === 'yay') {
                localStorage.setItem('wedding_auth', 'true');
                window.location.href = 'why.html';
            } else {
                document.getElementById('err').style.display = 'block';
            }
        }
    </script>
</body>

</html>
