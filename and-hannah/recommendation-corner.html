<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Recommendations | Pet & Hannah</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="/and-hannah/assets/heart.svg" type="image/svg+xml">
    <link rel="icon" href="/and-hannah/assets/heart.svg" sizes="any">
    <style>
        /* Custom layout structures for the dynamic recommendation section */
        .recs-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            width: 100%;
            margin-top: 20px;
        }

        .list-panel {
            height: 650px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .map-panel {
            position: sticky;
            top: 100px;
            height: 650px;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0,0,0,0.05);
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .item-card {
            background: var(--white);
            border: 1px solid rgba(0,0,0,0.06);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .item-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(33,63,34,0.08);
            border-color: var(--emerald);
        }

        .item-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        
        .cat-pet { color: var(--emerald); }
        .cat-hannah { color: var(--teak); }
        .cat-shared { color: var(--ruby); }

        .item-card h3 {
            margin: 0 0 8px 0;
            font-size: 1.15rem;
            font-family: var(--font-heading);
            color: var(--text);
        }

        .item-card p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* Info Window Text Restyling */
        .map-popup {
            font-family: var(--font-main);
            color: var(--text);
            max-width: 220px;
            padding: 5px;
        }
        .map-popup h4 {
            margin: 0 0 5px 0;
            font-family: var(--font-heading);
            font-size: 1.1rem;
            color: var(--emerald);
        }
        .map-popup p {
            margin: 0;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        @media (max-width: 900px) {
            .recs-layout {
                grid-template-columns: 1fr;
            }
            .map-panel {
                order: -1; /* Pushes the map canvas above the lists on mobile viewports */
                height: 380px;
                position: relative;
                top: 0;
            }
            .list-panel {
                height: auto;
            }
        }
    </style>
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="container">
        <div class="card-title">
            <h1 data-i18n="nav-recommendations">Our Favorite Spots</h1>
            <p class="text-center mb-4">Toggle across our curated maps to navigate Chiang Mai like a local.</p>
        </div>

        <div class="tab-container">
            <button class="tab-btn active" onclick="filterCategory('all', event)">All Spots</button>
            <button class="tab-btn" onclick="filterCategory('pet', event)">Pet's Picks</button>
            <button class="tab-btn" onclick="filterCategory('hannah', event)">Hannah's Picks</button>
            <button class="tab-btn" onclick="filterCategory('adventure', event)">Sights & Day Trips</button>
        </div>

        <div class="recs-layout">
            <div class="list-panel" id="locations-list"></div>

            <div class="map-panel">
                <div id="map"></div>
            </div>
        </div>
    </main>

    <script src="shared-logic.js"></script>
    <script>
        // Comprehensive coordinate arrays parsed from your MyMaps dataset
        const locationsData = [
            { name: "Wat Ban Den", lat: 19.1577, lng: 98.9785, category: "adventure", owner: "shared", desc: "Stunning, massive Lanna-style temple complex up in Mae Taeng. Striking blue roofs and brilliant architecture." },
            { name: "0 Kampong Village", lat: 18.7885, lng: 98.9912, category: "adventure", owner: "shared", desc: "A cozy cultural pocket to stroll through and observe traditional aesthetics." },
            { name: "Blue Coffee at Agriculture CMU", lat: 18.7946, lng: 98.9591, category: "hannah", owner: "hannah", desc: "Towering glass and timber cafe tucked into the university grounds. Dramatic views over fields." },
            { name: "Baan Kang Wat", lat: 18.7763, lng: 98.9487, category: "hannah", owner: "hannah", desc: "Charming local artist village village built out of traditional wood houses. Incredible craft studios, boutiques, and calm morning coffee." },
            { name: "Sourdough by Apple Fahey", lat: 18.7852, lng: 98.9650, category: "hannah", owner: "hannah", desc: "Phenomenal crusty artisanal sourdough breads and pastries. A favorite breakfast escape." },
            { name: "Huay Tueng Thao Waterfall", lat: 18.8654, lng: 98.9322, category: "adventure", owner: "shared", desc: "Tranquil trail escape at the base of the mountain range." },
            { name: "Huay Tueng Thao Restaurant", lat: 18.8631, lng: 98.9415, category: "adventure", owner: "shared", desc: "Great place to have a meal with a stunning, open view of the lake while sitting in bamboo huts." },
            { name: "Ruamchok Night Market", lat: 18.8239, lng: 99.0118, category: "pet", owner: "pet", desc: "Lively local night market packed with fantastic street stalls, local snacks, and northern curries." },
            { name: "Soy Milk & Congee (Sanpakoi)", lat: 18.7865, lng: 99.0088, category: "pet", owner: "pet", desc: "Comforting late-night Thai congee bowls, smooth hot soy milk, and fresh crispy dough sticks." },
            { name: "Mun Gai Hai Lam", lat: 18.7861, lng: 99.0073, category: "pet", owner: "pet", desc: "Superb Hainanese style chicken rice plates. Fast, tender, and intensely flavorful seasoning." },
            { name: "Ohkajhu (Nim City Daily)", lat: 18.7725, lng: 98.9783, category: "hannah", owner: "hannah", desc: "Massive organic farm-to-table salads, fresh cold-pressed juices, and healthy, robust mains." },
            { name: "Wat Phra That Doi Suthep", lat: 18.8050, lng: 98.9216, category: "adventure", owner: "shared", desc: "Chiang Mai's iconic golden mountain temple. Climbed via a Naga staircase for city-wide views." },
            { name: "Namtok Bua Thong (Sticky Waterfall)", lat: 19.0742, lng: 99.0805, category: "adventure", owner: "shared", desc: "The famous mineral waterfall you can climb right up like a lizard because the limestone is sticky!" },
            { name: "Pet's Family Favorite Seafood Spot", lat: 18.7460, lng: 98.9620, category: "pet", owner: "pet", desc: "Pet's family's favorite celebratory dinner spot! Only come if you like fresh seafood. If you decide to go, let Pet or Hannah know! We'll tell you how to order (or maybe we will tag along!)" },
            { name: "Madam Muk Second Hand Warehouse", lat: 18.8012, lng: 99.0195, category: "hannah", owner: "hannah", desc: "Prepare for this thrifting behemoth if you like vintage searching. Gigantic interconnected warehouses with cool coffee shops inside." },
            { name: "3 Baht Noodle", lat: 18.7905, lng: 99.0098, category: "pet", owner: "pet", desc: "Classic tiny bowls of pork noodles for just 3 Baht a pop. Stacking the empty bowls high is half the fun!" },
            { name: "THE HOUSE by Ginger", lat: 18.7925, lng: 98.9931, category: "shared", owner: "shared", desc: "Sophisticated Lanna-bistro setting. Perfect for a beautiful, premium sit-down dinner. Order the traditional northern platters!" },
            { name: "Si Tong Linen Clothing Shop", lat: 18.7882, lng: 98.9902, category: "pet", owner: "pet", desc: "Pet's favorite linen clothing boutique. Beautiful fabrics, modern minimalist items, and custom adjustments for very reasonable prices." },
            { name: "Muang Mai Wholesale Market", lat: 18.7954, lng: 98.9972, category: "adventure", owner: "shared", desc: "Vibrant, chaotic 24/7 wholesale fruit and vegetable market right along the river lines." },
            { name: "Mahason Music Bar", lat: 18.7981, lng: 99.0018, category: "pet", owner: "pet", desc: "Fun, high-energy local live music tavern to listen to acoustic Thai indie sets." },
            { name: "Good View Bar & Restaurant", lat: 18.7915, lng: 99.0035, category: "shared", owner: "shared", desc: "Classic open-air restaurant right on the Ping River bank. Massive menu, live bands, and lively evening atmosphere." },
            { name: "Wat Umong Suan Putthatham", lat: 18.7834, lng: 98.9515, category: "adventure", owner: "shared", desc: "Enchanting 700-year-old forest monastery temple featuring historic underground tunnels and mossy ruins." },
            { name: "Kanomjeen Sanpakoi", lat: 18.7857, lng: 99.0086, category: "pet", owner: "pet", desc: "Incredible, spice-fueled rice noodle curry bowls inside a local market corner. Highly recommended." },
            { name: "Flow Coffee Brewers", lat: 18.7901, lng: 98.9744, category: "hannah", owner: "hannah", desc: "Expertly pulled espresso shots, clean filter coffees, and sleek minimalist architecture." },
            { name: "Traditional Thai Textile Shop", lat: 18.7891, lng: 98.9915, category: "pet", owner: "pet", desc: "Beautiful handcrafted local northern fabrics, hand-woven indigo cottons, and custom garments." },
            { name: "Teahouse by Meijaihai Matcha", lat: 18.7825, lng: 98.9698, category: "hannah", owner: "hannah", desc: "Serene, beautifully silent tatami room dedicated to premium Japanese whisked matcha pairings." },
            { name: "Chang Moi Ice Syrup Stall", lat: 18.7911, lng: 98.9961, category: "pet", owner: "pet", desc: "Pet's absolute favorite Thai dessert stall. Running since Pet's mom was a child, now managed by the next generation. Order the shaved ice with red syrup, grass jelly, and condensed milk!" }
        ];

        let map;
        let markersArray = [];
        let activeInfoWindow = null;

        // Initializes the core map layer canvas
        function initMap() {
            const chiangMaiCenter = { lat: 18.795, lng: 98.985 };
            
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 12,
                center: chiangMaiCenter,
                styles: [
                    { "featureType": "poi.business", "elementType": "labels", "stylers": [{ "visibility": "off" }] },
                    { "featureType": "transit", "elementType": "labels.icon", "stylers": [{ "visibility": "off" }] }
                ],
                mapTypeControl: false,
                streetViewControl: false
            });

            // Feed and assemble the initial universal view
            renderCardsAndMarkers("all");
        }

        // Assembles text cards and anchors structural Google map pins onto the canvas
        function renderCardsAndMarkers(filterType) {
            // Flush out active DOM elements and existing pins
            clearMarkers();
            const listContainer = document.getElementById("locations-list");
            listContainer.innerHTML = "";

            const bounds = new google.maps.LatLngBounds();
            let visibleCount = 0;

            locationsData.forEach((spot) => {
                // Sorting conditional filters
                const matchesFilter = 
                    filterType === "all" || 
                    (filterType === "pet" && spot.owner === "pet") ||
                    (filterType === "hannah" && spot.owner === "hannah") ||
                    (filterType === "adventure" && spot.category === "adventure");

                if (!matchesFilter) return;

                visibleCount++;

                // Determine Pin styling parameters depending on owners
                let pinColor = "#3476ad"; // Shared / Blue
                if (spot.owner === "pet") pinColor = "#213f22"; // Pet / Deep Green
                if (spot.owner === "hannah") pinColor = "#803030"; // Hannah / Teak

                // Inject marker onto the Google Map instance
                const marker = new google.maps.Marker({
                    position: { lat: spot.lat, lng: spot.lng },
                    map: map,
                    title: spot.name,
                    icon: {
                        path: google.maps.SymbolPath.BACKWARD_CLOSED_ARROW,
                        fillColor: pinColor,
                        fillOpacity: 0.9,
                        strokeWeight: 1,
                        strokeColor: "#ffffff",
                        scale: 6
                    }
                });

                markersArray.push(marker);
                bounds.extend(marker.getPosition());

                // Set pop-up Info Window formatting
                const infoContent = `
                    <div class="map-popup">
                        <h4>${spot.name}</h4>
                        <p>${spot.desc}</p>
                    </div>
                `;
                const infoWindow = new google.maps.InfoWindow({ content: infoContent });

                // Pin click listener activation
                marker.addListener("click", () => {
                    if (activeInfoWindow) activeInfoWindow.close();
                    infoWindow.open(map, marker);
                    activeInfoWindow = infoWindow;
                });

                // Construct text panel cards
                const card = document.createElement("div");
                card.className = "item-card";
                
                let displayOwner = spot.owner === "shared" ? "Shared Favorite" : `${spot.owner.charAt(0).toUpperCase() + spot.owner.slice(1)}'s Pick`;
                let ownerClass = `cat-${spot.owner}`;

                card.innerHTML = `
                    <div class="item-category ${ownerClass}">${displayOwner}</div>
                    <h3>${spot.name}</h3>
                    <p>${spot.desc}</p>
                `;

                // Handle click synchronization between list panel text cards and map viewports
                card.addEventListener("click", () => {
                    map.panTo(marker.getPosition());
                    map.setZoom(14);
                    if (activeInfoWindow) activeInfoWindow.close();
                    infoWindow.open(map, marker);
                    activeInfoWindow = infoWindow;
                    
                    // Smooth bounce transition to scroll layout into focus on small viewports
                    if (window.innerWidth <= 900) {
                        document.getElementById("map").scrollIntoView({ behavior: 'smooth' });
                    }
                });

                listContainer.appendChild(card);
            });

            // Adjust viewport camera bounding frames naturally
            if (visibleCount > 0) {
                map.fitBounds(bounds);
                // Clamp max automatic zoom on single targets
                if (visibleCount === 1) {
                    map.setZoom(14);
                }
            }
        }

        function clearMarkers() {
            markersArray.forEach(m => m.setMap(null));
            markersArray = [];
        }

        // Connects top tab configurations directly with script filters
        function filterCategory(category, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderCardsAndMarkers(category);
        }
    </script>

    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDuFKwEBhMYqcRH3AyC69omkusy7bh0IzA&callback=initMap">
    </script>
</body>

</html>
