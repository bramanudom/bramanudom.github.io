<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Login | Pet & Hannah</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="/and-hannah/assets/heart.svg" type="image/svg+xml">
    <link rel="icon" href="/and-hannah/assets/heart.svg" sizes="any">
</head>

<body class="landing-body">
    <div class="landing-container">
        <main class="save-the-date-card">

            <img src="/and-hannah/assets/ring_photo.JPG" alt="Pet & Hannah" class="login-photo">
            <h2 class="couple-names login-welcome">Welcome</h2>
            <p class="date-announcement">Please enter the guest code from your invitation:</p>

            <div class="lookup-group">
                <input type="password" id="passInput" class="form-input" placeholder="Enter Code"
                    onkeypress="handleKeyPress(event)">
                <button onclick="checkPass()" class="btn-submit btn-inline">Enter</button>
            </div>

            <p id="err" class="form-error is-hidden">Incorrect code, please try again.</p>

            <a href="index.html" class="login-back-link">← Back to Save the Date</a>
        </main>
    </div>

    <script>
        // Salted SHA-256 hash of "pet-and-hannah:<code_in_lowercase>"
        // To generate a new hash in Terminal: printf "pet-and-hannah:newcode" | shasum -a 256
        const EXPECTED_HASH = '9cd22dd9cc4cf431bff63efc249ec8644100c768b88d85be52cf4b3eb900a87b';

        async function sha256(text) {
            const data = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        function getRedirectTarget() {
            const next = new URLSearchParams(window.location.search).get('next');
            if (next && /^[a-z0-9_-]+\.html$/i.test(next) && next.toLowerCase() !== 'login.html') {
                return next;
            }
            return 'schedule.html';
        }

        async function checkPass() {
            const pass = document.getElementById('passInput').value.toLowerCase().trim();
            const hash = await sha256(`pet-and-hannah:${pass}`);

            if (hash === EXPECTED_HASH) {
                localStorage.setItem('wedding_auth', EXPECTED_HASH);
                window.location.replace(getRedirectTarget());
            } else {
                const errElement = document.getElementById('err');
                errElement.style.display = 'block';
                errElement.style.animation = 'calmFadeIn 0.4s ease-out';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                checkPass();
            }
        }
    </script>
</body>

</html>
