<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet & Hannah</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="/and-hannah/assets/heart.svg" type="image/svg+xml">
    <link rel="icon" href="/and-hannah/assets/heart.svg" sizes="any">
</head>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
    // Trigger confetti when the window is fully loaded
    window.addEventListener('load', () => {
        // We add a slight delay (500ms) so it fires right as your 'reveal' animations finish
        setTimeout(() => {
            confetti({
                particleCount: 150,
                spread: 360,
                origin: { y: 0.6 }, // Fires from slightly below the center
                colors: ['#213f22', '#803030', '#3476ad', '#fdfaf3'],
                disableForReducedMotion: true // Respects guest's accessibility settings
            });
        }, 500);
    });
</script>

<body class="landing-body">
    <main class="landing-container">

        <div class="save-the-date-card">
            <section class="lang-block english-block">
                <h1 class="couple-names">Pet<br>&<br>Hannah</h1>
                <p class="wedding-announcement">are having a wedding!</p>
                <div class="date-display">Nov 6, 2027</div>
                <div class="location-display">Chiang Mai, Thailand</div>
                <p class="coming-soon-notes">More details to follow soon</p>
            </section>

            <div class="section-divider"></div>

            <section class="lang-block translation-block">
                <h2 class="multilingual-text">เพชรและแฮนน่าจะแต่งงานกัน!</h2>
                <div class="multilingual-details">
                    6 พฤศจิกายน 2027
                    <br>เชียงใหม่ ประเทศไทย
                </div>
                <p class="multilingual-notes">รายละเอียดเพิ่มเติมเร็วๆ นี้ค่ะ</p>
            </section>

            <div class="section-divider"></div>

            <section class="lang-block translation-block">
                <h2 class="multilingual-text">펫과 해나의 결혼식에 초대합니다!</h2>
                <div class="multilingual-details">
                    2027년 11월 6일
                    <br>태국 치앙마이
                </div>
                <p class="multilingual-notes">자세한 일정은 곧 안내해 드리겠습니다.</p>
            </section>
        </div>

    </main>
</body>

</html>
