<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Website | P & H</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body style="background: var(--emerald); display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div class="card" style="max-width: 400px; text-align: center;">
        <h2 style="font-family: var(--font-heading);">Welcome!</h2>
        <p>Please enter the guest code from your invitation:</p>
        <input type="password" id="passInput" placeholder="Enter Code">
        <button onclick="checkPass()" class="btn btn-teak" style="width: 100%;">Enter</button>
        <p id="err" style="color: var(--ruby); display: none; margin-top: 10px;">Incorrect code, please try again.</p>
    </div>

    <script>
        function checkPass() {
            const pass = document.getElementById('passInput').value.toLowerCase().trim();
            if (pass === 'yay') { // Change this to your desired password
                localStorage.setItem('wedding_auth', 'true');
                window.location.href = 'why.html'; // Redirect to the first internal page
            } else {
                document.getElementById('err').style.display = 'block';
            }
        }
    </script>
</body>

</html>
