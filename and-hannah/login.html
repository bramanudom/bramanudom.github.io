<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Pet & Hannah</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="/and-hannah/assets/heart.svg" type="image/svg+xml">
    <link rel="icon" href="/and-hannah/assets/heart.svg" sizes="any">
    <style>
        .login-photo-placeholder {
            width: 100%;
            max-width: 450px;
            height: 280px;
            background-color: var(--cream);
            border: 1px dashed rgba(128, 48, 48, 0.2);
            border-radius: var(--radius);
            margin: 0 auto 35px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.02);
        }

        /* Heart Core Graphic decoration */
        .login-photo-placeholder::before {
            content: "♥";
            font-size: 2.5rem;
            color: var(--teak);
            opacity: 0.25;
        }

        .login-photo {
            width: 100%;
            max-width: 450px;
            border-radius: var(--radius);
            margin: 0 auto 35px auto;
            height: 255px;
            display: block;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            object-fit: cover;
        }

        .login-back-link {
            display: inline-block;
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--emerald);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .login-back-link:hover {
            color: var(--teak);
        }
    </style>
</head>

<body class="landing-body">
    <div class="landing-container">
        <main class="save-the-date-card">

            <img src="/and-hannah/assets/ring_photo.JPG" alt="Pet & Hannah" class="login-photo">
            <h2 class="couple-names" style="font-size: clamp(2rem, 5vw, 2.8rem); margin-bottom: 10px;">Welcome</h2>
            <p class="wedding-announcement" style="margin-bottom: 30px;">Please enter the guest code from your
                invitation:</p>

            <div class="lookup-group">
                <input type="password" id="passInput" class="form-input" placeholder="Enter Code"
                    onkeypress="handleKeyPress(event)">
                <button onclick="checkPass()" class="btn-submit"
                    style="margin: 0; max-width: 120px; padding: 14px 25px;">Enter</button>
            </div>

            <p id="err" style="color: var(--teak); display: none; margin-top: 20px; font-weight: 600;">Incorrect code,
                please try again.</p>

            <a href="index.html" class="login-back-link">← Back to Save the Date</a>
        </main>
    </div>

    <script>
        function checkPass() {
            const pass = document.getElementById('passInput').value.toLowerCase().trim();
            if (pass === 'yay') {
                localStorage.setItem('wedding_auth', 'true');
                window.location.href = 'schedule.html';
            } else {
                const errElement = document.getElementById('err');
                errElement.style.display = 'block';
                errElement.style.animation = 'calmFadeIn 0.4s ease-out';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                checkPass();
            }
        }
    </script>
</body>

</html>
